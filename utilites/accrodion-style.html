<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Accordion — Schedule of Areas (matched)</title>

<style>
  :root{
    --bg: #ffffff;
    --panel-bg: #fafafa;
    --card-border: #e9e9e9;
    --accent: #0b3b57;       /* header link color */
    --muted: #6b6b6b;
    --radius: 6px;
    --icon-shadow: rgba(16,24,40,0.04);
  }

  /* demo wrapper */
  body{ font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; margin:24px; background:var(--bg); color:#222; }

  /* small demo image references (optional) */
  .demo-row{ display:flex; gap:12px; margin-bottom:18px; align-items:center; }
  .demo-row img{ height:40px; border-radius:4px; box-shadow: 0 1px 0 rgba(0,0,0,0.04); }

  /* Accordion container */
  #accordion { max-width:900px; margin:0 auto; }

  .card{
    border:1px solid var(--card-border);
    border-radius:8px;
    background:var(--panel-bg);
    overflow:hidden;
    margin-bottom:12px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }

  /* header row */
  .card-header{
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
  }

  .card-title{
    font-weight:700;
    font-size:16px;
    color:var(--accent);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }

  /* chevron on the right */
  .chev {
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .18s ease;
    color: #9aa6b2;
  }

  .card.collapsed .chev { transform: rotate(-90deg); }

  /* card body */
  .card-body{
    padding:18px;
    border-top:1px solid var(--card-border);
    background: #fff;
  }

  .collapse { display:none; }
  .collapse.show { display:block; }

  /* schedule boxes container */
  .unitSheduleAreInfo{
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
  }

  /* single colored box style */
  .cardIcon{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-width:54px;
    height:54px;
    padding:10px;
    border-radius:10px;
    font-weight:700;
    font-size:20px;
    box-shadow: 0 1px 0 var(--icon-shadow);
    color: #0b3b57;
  }

  /* icon (svg) */
  .cardIcon svg{ width:18px; height:18px; display:block; flex-shrink:0; }

  /* colors to match site */
  .cardIcon-bed{
    background: #e8f3ff;
    color: #0b4f88;
  }
  .cardIcon-bath{
    background: #fff2e9;
    color: #bf6a20;
  }
  .cardIcon-area{
    background: #eef7ec;
    color: #2d6a2f;
    padding:10px 12px;
    min-width:86px;
    font-size:15px;
  }
  .cardIcon-area sup{ font-size:10px; vertical-align:super; margin-left:2px; color: #0b3b57; }

  /* make the icon smaller on mobile */
  @media (max-width:420px){
    .cardIcon{ min-width:46px; height:46px; font-size:18px; padding:8px; }
    .cardIcon-area{ min-width:72px; font-size:14px }
    .card-body{ padding:12px }
    .card-header{ padding:12px }
  }

  /* Dark variant (like your second screenshot) - toggled by .dark on body */
  body.dark{
    --bg: #151515;
    --panel-bg: #222;
    --card-border: rgba(255,255,255,0.04);
    --accent: #e6eef6;
    --muted: #97a0a6;
    --icon-shadow: rgba(0,0,0,0.4);
    color: #e6eef6;
  }
  body.dark .card{ background: #1b1b1b; border-color: var(--card-border); }
  body.dark .card-body{ background: transparent; }
  body.dark .cardIcon{ background: transparent; box-shadow: none; color: #e6eef6; font-weight:600; border-radius:4px; min-width: unset; height: unset; padding:0; font-size:16px; }
  body.dark .cardIcon svg{ opacity:0.9 }
  body.dark .cardIcon-bed, body.dark .cardIcon-bath, body.dark .cardIcon-area{
    background: transparent;
    color: #e6eef6;
  }
  body.dark .cardIcon-area sup{ color: #e6eef6; font-size:12px; vertical-align:baseline; margin-left:4px; }

  /* Visual tweak to align icons like second screenshot: icons before numbers (inline) */
  .cardIcon .num { margin-left:6px; font-weight:700; }
  body.dark .cardIcon { display:inline-flex; align-items:center; gap:8px; }

  /* small helper to show both styles with a toggle button */
  .controls{ margin-bottom:12px; display:flex; gap:8px; align-items:center; }
  .controls button{ padding:8px 10px; border-radius:6px; border:1px solid var(--card-border); background:transparent; cursor:pointer; color:var(--accent); }
  body.dark .controls button{ color:var(--accent); border-color:rgba(255,255,255,0.06); }
</style>
</head>
<body>

<!-- optional demo images (these use the uploaded files you provided) -->
<div class="demo-row">
  <img src="/mnt/data/1f0694a2-b192-4560-ba83-7b60d8ed8d54.png" alt="site light screenshot" />
  <img src="/mnt/data/850ef00d-b7d5-4c89-994f-588462ab29a6.png" alt="site dark screenshot" />
</div>

<div class="controls">
  <button id="toggleTheme">Toggle dark/light preview</button>
  <em style="color:var(--muted); font-size:13px">(click header to open/close)</em>
</div>

<div id="accordion" class="unitAccordian">

  <div class="card" id="card1">
    <div class="card-header" data-target="#collapseOne" role="button" tabindex="0" aria-expanded="true">
      <a class="card-title" href="#collapseOne" aria-expanded="true">Schedule of Areas</a>
      <div class="chev" aria-hidden="true">
        <!-- chevron -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M9.3 6.7a1 1 0 0 1 1.4 0L15 11l-4.3 4.3a1 1 0 1 1-1.4-1.4L12.2 11 9.3 8.1a1 1 0 0 1 0-1.4z"/>
        </svg>
      </div>
    </div>

    <div id="collapseOne" class="collapse show" data-parent="#accordion">
      <div class="card-body">
        <div class="unitSheduleAreInfo" aria-hidden="false">

          <!-- Bed box -->
          <div class="cardIcon cardIcon-bed" title="Bedrooms">
            <!-- bed icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="currentColor">
              <path d="M2 13v6h2v-2h16v2h2v-6c0-1.657-1.343-3-3-3h-2V6c0-1.657-1.343-3-3-3H8C6.343 3 5 4.343 5 6v4H3c-1.657 0-3 1.343-3 3zM7 6c0-.552.448-1 1-1h8c.552 0 1 .448 1 1v4H7V6z"/>
            </svg>
            <span class="num">3</span>
          </div>

          <!-- Bath box -->
          <div class="cardIcon cardIcon-bath" title="Bathrooms">
            <!-- bath icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="currentColor">
              <path d="M7 10V7a5 5 0 0 1 10 0v3h1a3 3 0 0 1 3 3v5h-2v-2H2v2H0v-5a3 3 0 0 1 3-3h1zM9 7a3 3 0 1 1 6 0v3H9V7z"/>
            </svg>
            <span class="num">3</span>
          </div>

          <!-- Area box -->
          <div class="cardIcon cardIcon-area" title="Area">
            <!-- small box icon (optional) -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="currentColor" style="width:16px;height:16px;">
              <path d="M3 3h18v18H3z" fill="currentColor" opacity="0.06"></path>
              <path d="M5 5h14v14H5z" fill="none"></path>
            </svg>
            <span class="num">193 <sup>m</sup><sup style="font-size:10px;vertical-align:super">2</sup></span>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- second card collapsed by default -->
  <div class="card collapsed" id="card2">
    <div class="card-header" data-target="#collapseTwo" role="button" tabindex="0" aria-expanded="false">
      <a class="card-title" href="#collapseTwo" aria-expanded="false">Finishes &amp; Inclusions</a>
      <div class="chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M9.3 6.7a1 1 0 0 1 1.4 0L15 11l-4.3 4.3a1 1 0 1 1-1.4-1.4L12.2 11 9.3 8.1a1 1 0 0 1 0-1.4z"/>
        </svg>
      </div>
    </div>

    <div id="collapseTwo" class="collapse" data-parent="#accordion">
      <div class="card-body">
        <p style="margin:0;color:var(--muted)">Example content for the second panel — replace with real details.</p>
      </div>
    </div>
  </div>

</div>

<script>
  (function(){
    const accordion = document.getElementById('accordion');

    // click/keyboard support on headers
    accordion.addEventListener('click', function(e){
      const header = e.target.closest('.card-header');
      if(!header) return;
      toggleCard(header);
    });

    accordion.addEventListener('keydown', function(e){
      const header = e.target.closest('.card-header');
      if(!header) return;
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        toggleCard(header);
      }
    });

    function toggleCard(header){
      const targetSelector = header.getAttribute('data-target') || header.querySelector('.card-title')?.getAttribute('href');
      if(!targetSelector) return;
      const panel = document.querySelector(targetSelector);
      const parentCard = header.closest('.card');
      const isOpen = panel.classList.contains('show');

      // accordion behavior: close all
      document.querySelectorAll('#accordion .card').forEach(c=>{
        c.classList.add('collapsed');
        c.querySelector('.collapse')?.classList.remove('show');
        c.querySelector('.card-header')?.setAttribute('aria-expanded','false');
        c.querySelector('.card-title')?.setAttribute('aria-expanded','false');
      });

      // open clicked one if it was closed
      if(!isOpen){
        panel.classList.add('show');
        parentCard.classList.remove('collapsed');
        header.setAttribute('aria-expanded','true');
        parentCard.querySelector('.card-title')?.setAttribute('aria-expanded','true');
      }
    }

    // init state consistency
    (function init(){
      document.querySelectorAll('#accordion .card').forEach(c=>{
        const panel = c.querySelector('.collapse');
        if(panel && panel.classList.contains('show')){
          c.classList.remove('collapsed');
          c.querySelector('.card-header')?.setAttribute('aria-expanded','true');
          c.querySelector('.card-title')?.setAttribute('aria-expanded','true');
        } else {
          c.classList.add('collapsed');
          c.querySelector('.card-header')?.setAttribute('aria-expanded','false');
          c.querySelector('.card-title')?.setAttribute('aria-expanded','false');
        }
      });
    })();

    // theme toggle for demo (shows dark variant like your second screenshot)
    document.getElementById('toggleTheme').addEventListener('click', function(){
      document.body.classList.toggle('dark');
    });

  })();
</script>

</body>
</html>
