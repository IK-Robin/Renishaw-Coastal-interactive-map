<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reverse Hover Button</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 50px;
}

/* Wrapper */
.ue-link-wrap {
  display: inline-block;
}

/* Link */
.ue-link {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: #000;
  font-weight: 700;
  position: relative;
}

/* Text */
.ue-link-hover-effect-text {
  font-size: 16px;
  letter-spacing: 1px;
}

/* Underline (NOW STARTS FULL) */
.ue-link-hover-effect-spacing {
  position: absolute;
  bottom: -4px;
  left: 0;
  height: 2px;
  width: 100%;      /* ← FULL WIDTH BY DEFAULT */
  background: #000;
  transition: width 0.35s ease;
}

/* Icon */
.ue-link-hover-effect-icon svg {
  width: 18px;
  height: 18px;
  transition: transform 0.3s ease;
  fill: #000;
}

/* Hover effects */
.ue-link:hover .ue-link-hover-effect-spacing {
  width: 0%;        /* ← SHRINKS TO ZERO ON HOVER */
}
</style>
</head>
<body>

<div class="ue-link-wrap">
  <a class="ue-link" href="#next">
    <div class="ue-link-hover-effect-text">DISCOVER RENISHAW</div>

    <div class="ue-link-hover-effect-spacing"></div>

   
  </a>
</div>

</body>
</html>
